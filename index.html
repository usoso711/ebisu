<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>恵比寿ランチ</title>

<meta name="apple-mobile-web-app-title" content="恵比寿ランチ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.PNG">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg1:#111827;
  --bg2:#3b0764;
  --card:rgba(255,255,255,.12);
  --card2:rgba(255,255,255,.18);
  --text:#fff;
  --muted:rgba(255,255,255,.72);
  --accent:#facc15;
  --green:#34d399;
  --danger:#f87171;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at top left,
      #fb7185 0,
      transparent 30%
    ),
    radial-gradient(
      circle at bottom right,
      #22d3ee 0,
      transparent 32%
    ),
    linear-gradient(
      145deg,
      var(--bg1),
      var(--bg2)
    );

  -webkit-tap-highlight-color:transparent;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:
    calc(10px + env(safe-area-inset-top))
    12px
    calc(45px + env(safe-area-inset-bottom));
}

header{
  text-align:center;
  padding:8px 4px 4px;
}

.badge{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(12px);
  font-size:12px;
  color:var(--muted);
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:clamp(32px,9vw,58px);
  letter-spacing:-.055em;
  line-height:1;
}

h1 span{
  color:var(--accent);
  text-shadow:0 0 24px rgba(250,204,21,.45);
}

.lead{
  margin:12px auto 0;
  max-width:650px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

.topbar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:7px;
  margin:9px 0;
  flex-wrap:wrap;
}

.user-pill{
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  font-size:13px;
}

.card{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  background:
    linear-gradient(
      180deg,
      var(--card2),
      var(--card)
    );
  box-shadow:0 24px 70px rgba(0,0,0,.25);
  backdrop-filter:blur(18px);
}

.auth{
  max-width:520px;
  margin:28px auto;
}

.auth h2{
  margin:0 0 14px;
}

.field{
  display:grid;
  gap:6px;
  margin:10px 0;
}

.field label{
  font-size:13px;
  color:var(--muted);
}

input,
textarea,
select{
  width:100%;
  min-width:0;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.22);
  color:#fff;
  border-radius:13px;
  padding:12px 13px;
  outline:none;
}

select option{
  color:#111;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--accent);
}

.btns{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  margin-top:12px;
}

@media(min-width:480px){
  .btns.two{
    grid-template-columns:1fr 1fr;
  }
}

button,
.link-btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  color:#111827;
  background:var(--accent);
  text-decoration:none;
  text-align:center;
}

button.secondary,
.link-btn.secondary{
  color:#fff;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.14);
}

button.danger{
  color:#fff;
  background:rgba(248,113,113,.2);
  border:1px solid rgba(248,113,113,.35);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.error{
  color:#fecaca;
  background:rgba(127,29,29,.25);
  border:1px solid rgba(248,113,113,.3);
  padding:10px;
  border-radius:12px;
  font-size:13px;
  margin-top:10px;
}

.success{
  color:#bbf7d0;
  background:rgba(6,78,59,.25);
  border:1px solid rgba(52,211,153,.3);
  padding:10px;
  border-radius:12px;
  font-size:13px;
  margin-top:10px;
}

/* =====================================================
   ルーレット
===================================================== */

.roulette-card{
  position:relative;
  padding:
    10px
    8px
    16px;
  overflow:hidden;
}

.roulette-area{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wheel-stage{
  width:min(94vw,620px);
  max-width:100%;
  aspect-ratio:1/1;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  touch-action:manipulation;
}

#wheelCanvas{
  display:block;
  width:100%;
  height:100%;
  max-width:100%;
  aspect-ratio:1/1;
  filter:
    drop-shadow(
      0 20px 35px rgba(0,0,0,.35)
    );
}

/*
  上の三角形が当選位置。
*/
.pointer{
  position:absolute;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;

  width:0;
  height:0;

  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-top:39px solid #fff;

  filter:
    drop-shadow(0 4px 7px rgba(0,0,0,.45));
}

.pointer::after{
  content:"";
  position:absolute;
  left:-14px;
  top:-34px;

  width:28px;
  height:28px;

  background:var(--accent);
  border-radius:50%;

  box-shadow:
    0 0 20px rgba(250,204,21,.75);
}

.wheel-center-button{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  width:25%;
  aspect-ratio:1/1;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #374151,
      #111827 65%
    );

  border:
    7px solid rgba(255,255,255,.2);

  box-shadow:
    0 0 0 9px rgba(0,0,0,.15),
    0 12px 30px rgba(0,0,0,.45),
    inset 0 4px 8px rgba(255,255,255,.12);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-weight:900;
  font-size:clamp(10px,3vw,18px);
  line-height:1.25;

  z-index:8;
}

.wheel-center-button:active{
  transform:translate(-50%,-50%) scale(.96);
}

.spin-help{
  text-align:center;
  margin:2px 0 12px;
}

.spin-help span{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.30);
  color:#fff;
  font-size:12px;
  backdrop-filter:blur(8px);
}

.result-panel{
  width:100%;
  margin-top:10px;
  padding:16px;
  border-radius:21px;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.13);
}

.status{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}

.result{
  min-height:145px;
  border-radius:18px;
  padding:16px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);
}

.genre{
  display:inline-block;
  padding:5px 10px;
  background:rgba(250,204,21,.16);
  color:#fde68a;
  border-radius:999px;
  font-size:12px;
  margin-bottom:8px;
}

.result h2{
  margin:0 0 7px;
  font-size:clamp(21px,6vw,28px);
}

.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.actions{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  margin-top:12px;
}

@media(min-width:460px){
  .actions{
    grid-template-columns:1fr 1fr;
  }
}

.full{
  grid-column:1/-1;
}

.settings{
  display:grid;
  gap:10px;
  margin-top:13px;
}

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:12px 13px;
  border-radius:16px;

  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

.switch-row strong{
  display:block;
  font-size:13px;
}

.switch-row small{
  display:block;
  color:var(--muted);
  margin-top:3px;
  font-size:11px;
}

input[type=checkbox]{
  width:23px;
  height:23px;
  accent-color:var(--accent);
}

/* =====================================================
   リスト
===================================================== */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-head h3{
  margin:0;
  font-size:18px;
}

.count{
  font-size:11px;
  color:var(--muted);
}

.list{
  display:grid;
  gap:9px;
}

.item{
  padding:12px;
  border-radius:16px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.09);
}

.item-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}

.name{
  font-weight:800;
}

.info{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.visited{
  color:var(--green);
  font-size:11px;
  white-space:nowrap;
}

.empty{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.shop-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}

.shop-actions button{
  padding:8px 10px;
  font-size:11px;
}

.admin-tools{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:9px;
}

.mini{
  padding:7px 9px!important;
  border-radius:10px!important;
  font-size:11px!important;
}

/* =====================================================
   コメント
===================================================== */

.comments{
  margin-top:10px;
  border-top:1px solid rgba(255,255,255,.1);
  padding-top:10px;
}

.comment{
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.comment:last-child{
  border-bottom:0;
}

.comment-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
}

.comment-body{
  font-size:13px;
  line-height:1.6;
  margin-top:3px;
  white-space:pre-wrap;
  word-break:break-word;
}

.like{
  background:transparent;
  color:#fff;
  border:0;
  padding:3px 5px;
  font-size:11px;
}

/* =====================================================
   モーダル
===================================================== */

.modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.65);

  display:none;
  align-items:center;
  justify-content:center;

  padding:16px;

  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;

  background:#1b1730;

  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;

  padding:17px;

  box-shadow:0 30px 100px #000;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  margin:0;
}

.x{
  background:rgba(255,255,255,.1);
  color:#fff;
  border:0;
  padding:7px 10px;
  border-radius:10px;
}

/* =====================================================
   Toast
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  width:min(92vw,450px);

  padding:12px 15px;

  border-radius:15px;

  background:rgba(17,24,39,.95);
  color:#fff;

  border:1px solid rgba(255,255,255,.18);

  box-shadow:0 20px 50px rgba(0,0,0,.35);

  opacity:0;
  pointer-events:none;

  transition:.25s;

  z-index:80;

  text-align:center;
  font-size:13px;
}

.toast.show{
  opacity:1;
  bottom:28px;
}

.hidden{
  display:none!important;
}

/* スマホ調整 */
@media(max-width:600px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .roulette-card{
    padding-left:5px;
    padding-right:5px;
  }

  .wheel-stage{
    width:96vw;
  }

  .result-panel{
    padding:13px;
  }

  .topbar{
    justify-content:center;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTH
===================================================== -->

<div id="authView" class="app">

<header>
  <div class="badge">🍽️ 恵比寿ランチ</div>

  <h1>
    今日のランチを<br>
    <span>運命で決める</span>
  </h1>

  <p class="lead">
    みんなの候補から、今日のランチを運命で決定。
  </p>
</header>

<div class="card auth">

  <h2 id="authTitle">ログイン</h2>

  <div id="authMessage"></div>

  <div id="usernameField" class="field hidden">
    <label>ユーザー名</label>
    <input
      id="username"
      maxlength="30"
      placeholder="例：Yusuke">
  </div>

  <div class="field">
    <label>メールアドレス</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com">
  </div>

  <div class="field">
    <label>パスワード</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="6文字以上">
  </div>

  <div class="btns">

    <button id="authBtn">
      ログイン
    </button>

    <button
      id="toggleAuth"
      class="secondary">
      新規登録はこちら
    </button>

    <button
      id="guestBtn"
      class="secondary">
      👀 ゲストでルーレットを見る
    </button>

  </div>

  <p class="hint">
    ゲストはログイン不要でルーレットを回せます。
  </p>

</div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="appView" class="app hidden">

<header>

  <div class="badge">
    🍽️ 恵比寿ランチ
  </div>

  <h1>
    今日のランチを<br>
    <span>運命で決める</span>
  </h1>

  <p class="lead">
    みんなの候補から、今日のランチを運命で決定。
  </p>

</header>


<div class="topbar">

  <span
    id="userPill"
    class="user-pill">
  </span>

  <button
    id="logoutBtn"
    class="secondary mini">
    ログアウト
  </button>

</div>


<!-- =====================================================
     ROULETTE
===================================================== -->

<section class="card roulette-card">

  <div class="roulette-area">

    <div
      id="wheelStage"
      class="wheel-stage">

      <div class="pointer"></div>

      <canvas
        id="wheelCanvas">
      </canvas>

      <button
        id="wheelCenterButton"
        class="wheel-center-button">
        TAP<br>START
      </button>

    </div>

  </div>


  <div class="spin-help">
    <span id="spinHelpText">
      🎰 ルーレットをタップしてスタート
    </span>
  </div>


  <div class="result-panel">

    <div
      id="status"
      class="status">
      候補を読み込み中...
    </div>

    <div
      id="result"
      class="result">

      <span class="genre">
        READY
      </span>

      <h2>
        ルーレットを回してね
      </h2>

      <div class="meta">
        条件に合うお店から選びます。
      </div>

    </div>


    <div class="actions">

      <button
        id="spinBtn">
        🎲 スタート
      </button>

      <button
        id="visitedBtn"
        class="secondary"
        disabled>
        ✅ 行った！
      </button>

      <a
        id="mapBtn"
        class="link-btn"
        href="#"
        target="_blank"
        rel="noopener"
        style="display:none">
        📍 地図で見る
      </a>

      <button
        id="commentBtn"
        class="secondary"
        disabled>
        💬 コメントを見る
      </button>

    </div>

  </div>


  <div class="settings">

    <label class="switch-row">

      <div>
        <strong>
          今週行った店を避ける
        </strong>

        <small>
          月曜始まり・所属に応じて判定
        </small>
      </div>

      <input
        id="avoidWeekVisited"
        type="checkbox"
        checked>

    </label>


    <label class="switch-row">

      <div>
        <strong>
          昨日と同じジャンルを避ける
        </strong>

        <small>
          昨日の履歴から判定
        </small>
      </div>

      <input
        id="avoidYesterdayGenre"
        type="checkbox"
        checked>

    </label>

  </div>

</section>


<!-- =====================================================
     履歴
===================================================== -->

<section class="card">

  <div class="section-head">

    <h3>
      📒 ランチ履歴
    </h3>

    <span
      id="historyCount"
      class="count">
    </span>

  </div>


  <div class="field">

    <label>
      表示する所属
    </label>

    <select id="historyAffiliationFilter">
      <option value="all">
        全所属
      </option>
    </select>

  </div>


  <div
    id="historyList"
    class="list">
  </div>

</section>


<!-- =====================================================
     店舗
===================================================== -->

<section class="card">

  <div class="section-head">

    <h3>
      ⭐ 候補リスト
    </h3>

    <span
      id="shopCount"
      class="count">
    </span>

  </div>


  <div
    id="shopList"
    class="list">
  </div>

</section>


<!-- =====================================================
     店舗管理
===================================================== -->

<section
  id="adminCard"
  class="card hidden">

  <div class="section-head">

    <h3>
      🏪 店舗管理
    </h3>

    <button
      id="addShopBtn"
      class="mini">
      ＋ お店を追加
    </button>

  </div>

  <p class="hint">
    店舗の追加・編集・削除ができます。
  </p>

</section>

</div>


<!-- =====================================================
     COMMENT MODAL
===================================================== -->

<div
  id="commentModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h3 id="commentTitle">
        💬 コメント
      </h3>

      <button
        class="x"
        onclick="closeModal()">
        閉じる
      </button>

    </div>


    <div
      id="commentsList"
      class="comments">
    </div>


    <div class="field">

      <label>
        コメント
      </label>

      <textarea
        id="commentBody"
        maxlength="1000"
        placeholder="このお店について一言">
      </textarea>

    </div>


    <button
      id="sendCommentBtn">
      コメントする
    </button>

  </div>

</div>


<!-- =====================================================
     SHOP MODAL
===================================================== -->

<div
  id="shopModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h3 id="shopModalTitle">
        お店を追加
      </h3>

      <button
        class="x"
        onclick="closeShopModal()">
        閉じる
      </button>

    </div>


    <input
      type="hidden"
      id="shopId">


    <div class="field">

      <label>
        店名
      </label>

      <input id="shopName">

    </div>


    <div class="field">

      <label>
        ジャンル
      </label>

      <input id="shopGenre">

    </div>


    <div class="field">

      <label>
        評価
      </label>

      <input
        id="shopRating"
        type="number"
        min="0"
        max="5"
        step="0.01"
        value="3.50">

    </div>


    <div class="field">

      <label>
        メモ
      </label>

      <textarea id="shopNote"></textarea>

    </div>


    <div class="field">

      <label>
        Google Maps URL
      </label>

      <input
        id="shopMap"

function esc(v){

  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(msg){

  $("toast").textContent=msg;

  $("toast").classList.add("show");

  setTimeout(()=>{

  },2500);

}


function dateKey(d=new Date()){

  return `${d.getFullYear()}-${
    String(d.getMonth()+1).padStart(2,"0")
  }-${
    String(d.getDate()).padStart(2,"0")
  }`;

}


function weekStart(){

  const d=new Date();

  const day=d.getDay();

  d.setDate(
    d.getDate()+
    (day===0?-6:1-day)
  );

  d.setHours(0,0,0,0);

  return d;

}


function isThisWeek(s){

  if(!s)return false;

  const d=new Date(
    s+"T00:00:00"
  );

  const st=weekStart();

  const en=new Date(st);

  en.setDate(en.getDate()+7);

  return d>=st&&d<en;

}


function yesterday(){

  const d=new Date();

  d.setDate(d.getDate()-1);

  return dateKey(d);

}


/* =========================================================
   WEIGHTED RANDOM
========================================================= */

function weightedRandom(a){

  if(!a.length)return null;

  const weights=a.map(x=>
    Math.max(
      1,
      Number(x.rating||0)*10
    )
  );

  const total=weights.reduce(
    (a,b)=>a+b,
    0
  );

  let r=Math.random()*total;

  for(let i=0;i<a.length;i++){

    r-=weights[i];

    if(r<=0)return a[i];

  }

  return a[a.length-1];

}

/* =========================================================
   CANDIDATES
========================================================= */

function getCandidates(){

  if(!shops.length){

    return [];

  }


  /*
    ゲストは店舗をすべて候補にする。
  */

  if(
    currentProfile?.role==="guest"
  ){

    return [...shops];

  }


  const weekVisited=
    new Set(
      history
      .filter(x=>
        isThisWeek(x.visited_date)
      )
      .map(x=>x.shop_id)
    );


  const yesterdayRows=
    history.filter(
      x=>x.visited_date===yesterday()
    );


  const yesterdayGenres=
    new Set(
      yesterdayRows
      .map(x=>x.shops?.genre)
      .filter(Boolean)
    );


  let candidates=
    shops.filter(s=>{

      const avoidWeek=
        $("avoidWeekVisited").checked;

      const avoidGenre=
        $("avoidYesterdayGenre").checked;


      if(
        avoidWeek &&
        weekVisited.has(s.id)
      ){

        return false;

      }


      if(
        avoidGenre &&
        yesterdayGenres.size &&
        yesterdayGenres.has(s.genre)
      ){

        return false;

      }


      return true;

    });


  /*
    条件を厳しくしすぎて
    0件になった場合は
    昨日ジャンルだけ解除。
  */

  if(
    !candidates.length &&
    $("avoidYesterdayGenre").checked
  ){

    candidates=
      shops.filter(s=>
        !$("avoidWeekVisited").checked||
        !weekVisited.has(s.id)
      );

  }


  /*
    それでも0件なら全店舗。
  */

  if(!candidates.length){

    candidates=[...shops];

  }


  return candidates;

}


function updateCandidates(){

}


/* =========================================================
   WHEEL CANVAS
========================================================= */

const canvas=
  $("wheelCanvas");

const ctx=
  canvas.getContext("2d");


function resizeWheel(){

  const rect=
    canvas.getBoundingClientRect();

  const dpr=
    Math.min(
      window.devicePixelRatio||1,
      2
    );


  canvas.width=
    Math.round(
      rect.width*dpr
    );

  canvas.height=
    Math.round(
      rect.height*dpr
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  drawWheel();

}


window.addEventListener(
  "resize",
  resizeWheel
);


/* =========================================================
   COLORS
========================================================= */

const wheelColors=[
  "#ff5c73",
  "#ff9f1c",
  "#26c6a0",
  "#35a7ff",
  "#9b5de5",
  "#f72585",
  "#8bd000",
  "#00b8d9",
  "#ff6b35",
  "#845ec2",
  "#00c9a7",
  "#ff8066"
];


function roundedRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  const rr=
    Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+rr,y);

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    rr
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    rr
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    rr
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    rr
  );

  ctx.closePath();

}


/* =========================================================
   DRAW WHEEL
========================================================= */

function drawWheel(){

  if(!canvas)return;

  const w=
    canvas.clientWidth;

  const h=
    canvas.clientHeight;


  if(!w||!h)return;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  const cx=w/2;
  const cy=h/2;

  const radius=
    Math.min(w,h)/2-10;


  const items=
    wheelItems.length
      ?wheelItems
      :shops;


  if(!items.length){

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      radius,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(255,255,255,.12)";

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.font=
      "bold 18px system-ui";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "候補を読み込み中",
      cx,
      cy
    );

    return;

  }


  const n=items.length;

  const slice=
    Math.PI*2/n;


  /*
    Canvasを回転させる。
    pointerは12時方向。
  */

  ctx.save();

  ctx.translate(
    cx,
    cy
  );

  ctx.rotate(
    wheelRotation*Math.PI/180
  );


  for(let i=0;i<n;i++){

    /*
      セクター中心角。
      0番を12時方向から開始。
    */

    const start=
      -Math.PI/2+
      i*slice;

    const end=
      start+slice;


    ctx.beginPath();

    ctx.moveTo(
      0,
      0
    );

    ctx.arc(
      0,
      0,
      radius,
      start,
      end
    );

    ctx.closePath();

    ctx.fillStyle=
      wheelColors[
        i%wheelColors.length
      ];

    ctx.fill();


    ctx.strokeStyle=
      "rgba(255,255,255,.45)";

    ctx.lineWidth=
      Math.max(
        1,
        Math.min(
          3,
          radius*.012
        )
      );

    ctx.stroke();


    /*
      店名
      セクター中央に沿わせて表示。
    */

    const mid=
      start+slice/2;


    ctx.save();

    ctx.rotate(mid);


    /*
      文字を半径方向に配置。
      これにより横書きで変な向きにならず
      ルーレットの枠に沿って読める。
    */

    const textRadius=
      radius*.69;


    ctx.translate(
      textRadius,
      0
    );


    /*
      文字が上下逆さまにならないように調整。
    */

    let textAngle=0;

    if(
      mid>
      Math.PI/2 &&
      mid<
      Math.PI*1.5
    ){

      ctx.rotate(Math.PI);

    }


    let name=
      String(
        items[i].name||""
      );


    /*
      長すぎる店名は
      セクター幅に合わせて縮小。
    */

    const maxWidth=
      Math.max(
        42,
        radius*
        Math.sin(slice/2)*
        1.45
      );


    let fontSize=
      Math.max(
        9,
        Math.min(
          19,
          radius*.065
        )
      );


    ctx.font=
      `900 ${fontSize}px system-ui`;

    while(
      ctx.measureText(name).width>
      maxWidth &&
      fontSize>8
    ){

      fontSize-=1;

      ctx.font=
        `900 ${fontSize}px system-ui`;

    }


    /*
      それでも長すぎる場合は省略。
    */

    while(
      ctx.measureText(name).width>
      maxWidth &&
      name.length>4
    ){

      name=
        name.slice(
          0,
          -1
        )+"…";

    }


    /*
      影
    */

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.lineWidth=4;

    ctx.strokeStyle=
      "rgba(0,0,0,.45)";

    ctx.strokeText(
      name,
      0,
      0
    );


    ctx.fillStyle="#fff";

    ctx.fillText(
      name,
      0,
      0
    );


    ctx.restore();

  }


  /*
    外周
  */

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.55)";

  ctx.lineWidth=7;

  ctx.stroke();


  /*
    内側リング
  */

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    radius*.88,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.22)";

  ctx.lineWidth=2;

  ctx.stroke();


  ctx.restore();


  /*
    中央部分
  */

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius*.22,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(17,24,39,.96)";

  ctx.fill();

  ctx.strokeStyle=
    "rgba(255,255,255,.2)";

  ctx.lineWidth=6;

  ctx.stroke();

}


/* =========================================================
   FIND SELECTED INDEX
========================================================= */

function selectedIndexForRotation(
  rotation,
  itemCount
){

  if(!itemCount)return 0;


  const slice=
    360/itemCount;


  /*
    pointerは画面上12時。

    Canvas側ではwheelRotationだけ回っている。

    各店舗の中心角は
      index * slice

    その店舗の中心を12時に持ってくるため、
    rotationは逆方向。

    この計算を停止位置の基準として使う。
  */

  let r=
    ((rotation%360)+360)%360;


  let index=
    Math.round(
      (-r)/slice
    );


  index=
    (
      index%itemCount+
      itemCount
    )%itemCount;


  return index;

}


/* =========================================================
   START
========================================================= */

function startWheel(){

  if(isSpinning)return;

  const candidates=
    getCandidates();


  if(!candidates.length){

    toast(
      "候補のお店がありません。"
    );

    return;

  }


  wheelItems=
    candidates;


  drawWheel();


  isSpinning=true;

  stopRequested=false;


  $("spinBtn").textContent=
    "⏹ ストップ";

  $("wheelCenterButton").innerHTML=
    "TAP<br>STOP";

  $("spinHelpText").textContent=
    "🛑 もう一度タップでストップ";


  $("visitedBtn").disabled=true;

  $("commentBtn").disabled=true;

  $("mapBtn").style.display="none";


  /*
    スタート時は高速で回す。
    一定速度で回すので、
    ストップ時に加速しない。
  */

  let last=
    performance.now();


  function animate(now){

    if(!isSpinning)return;


    const delta=
      now-last;

    last=now;


    /*
      約720度/秒。
    */

    wheelRotation+=
      delta*.72;


    wheelRotation%=
      360;


    drawWheel();


    spinAnimation=
      requestAnimationFrame(
        animate
      );

  }


  spinAnimation=
    requestAnimationFrame(
      animate
    );

}


/* =========================================================
   STOP
========================================================= */

function stopWheel(){

  if(!isSpinning)return;

  if(stopRequested)return;

  stopRequested=true;

  isSpinning=false;


  if(spinAnimation){

    cancelAnimationFrame(
      spinAnimation
    );

  }


  /*
    現在位置から候補を1つ選択。
    その店舗が必ずpointerに来るように
    最終角度を計算する。
  */

  const candidates=
    wheelItems;


  const selected=
    weightedRandom(
      candidates
    );


  if(!selected)return;


  const index=
    candidates.findIndex(
      x=>x.id===selected.id
    );


  const n=
    candidates.length;


  const slice=
    360/n;


  /*
    店舗中心を12時に合わせる。

    現在角度から、
    選択店舗が上に来る角度を算出。
  */

  const targetBase=
    -index*slice;


  const current=
    wheelRotation;


  let target=
    targetBase;


  /*
    現在位置より十分先で止める。
    4〜6周程度。
  */

  while(
    target<=current+360*4
  ){

    target+=360;

  }


  /*
    選択した店を
    セクター中央ではなく少し中央寄りに。
  */

  target+=0;


  /*
    CSS transitionではなく
    requestAnimationFrameで
    ease-outを実装。

    ストップ時に加速はしない。
    最初から最後まで減速するだけ。
  */

  const startRotation=
    current;

  const distance=
    target-startRotation;

  const duration=
    2800;


  const startTime=
    performance.now();


  $("spinBtn").disabled=true;

  $("wheelCenterButton").disabled=true;


  function decelerate(now){

    const elapsed=
      now-startTime;


    const t=
      Math.min(
        1,
        elapsed/duration
      );


    /*
      cubic ease-out
      0 → 高速
      → 徐々に減速
      → 0
    */

    const ease=
      1-Math.pow(
        1-t,
        4
      );


    wheelRotation=
      startRotation+
      distance*ease;


    drawWheel();


    if(t<1){

      requestAnimationFrame(
        decelerate
      );

    }else{

      wheelRotation=
        target;

      drawWheel();

      /*
        ★ここで選択した店舗を
        そのまま結果に使う。
        画面上のpointer位置と
        currentShopが必ず一致する。
      */

      currentShop=
        selected;


      showResult(
        selected,
        candidates.length
      );


      $("spinBtn").disabled=false;

      $("spinBtn").textContent=
        "🎲 もう一度回す";

      $("wheelCenterButton").disabled=false;

      $("wheelCenterButton").innerHTML=
        "TAP<br>START";

      $("spinHelpText").textContent=
        "🎰 ルーレットをタップしてスタート";

    }

  }


  requestAnimationFrame(
    decelerate
  );

}


/* =========================================================
   SPIN BUTTON
========================================================= */

$("spinBtn").onclick=()=>{

  if(isSpinning){

    stopWheel();

  }else{

    startWheel();

  }

};


/* =========================================================
   WHEEL TAP
========================================================= */

$("wheelStage").addEventListener(
  "click",
  e=>{

    /*
      中央ボタン自体のclickも
      wheelStageに伝わるので、
      ここで二重実行を防ぐ。
    */

    if(
      e.target===
      $("wheelCenterButton")
    ){

      return;

    }


    if(isSpinning){

      stopWheel();

    }else{

      startWheel();

    }

  }
);


$("wheelCenterButton").onclick=e=>{

  e.stopPropagation();


  if(
    $("wheelCenterButton").disabled
  ){

    return;

  }


  if(isSpinning){

    stopWheel();

  }else{

    startWheel();

  }

};


/* =========================================================
   RESULT
========================================================= */

function showResult(
  s,
  count
){

  $("wheelCenterButton").innerHTML=
    "決定";


  $("result").innerHTML=`

    <span class="genre">
      ${esc(s.genre)}
    </span>

    <h2>
      🎉 ${esc(s.name)}
    </h2>

    <div class="meta">

      ⭐ 評価：
      ${Number(
        s.rating||0
      ).toFixed(2)}

      <br>

      ${esc(s.note||"")}

      <br>

      候補 ${count} 件から選ばれました。

    </div>

  `;


  $("status").textContent=
    "今日のランチ、決まりました！";


  if(s.map_url){

    $("mapBtn").href=
      s.map_url;

    $("mapBtn").style.display=
      "block";

  }else{

    $("mapBtn").style.display=
      "none";

  }


  if(
    currentProfile?.role!=="guest"
  ){

    $("visitedBtn").disabled=false;

  }


  $("commentBtn").disabled=false;

}


/* =========================================================
   SETTINGS
========================================================= */

$("avoidWeekVisited")
  .onchange=updateCandidates;

$("avoidYesterdayGenre")
  .onchange=updateCandidates;


/* =========================================================
   VISITED
========================================================= */

$("visitedBtn").onclick=async()=>{

  if(!currentShop)return;

  if(
    currentProfile?.role==="guest"
  ){

    return;

  }


  const affiliation=
    currentProfile?.affiliation||
    null;


  const {
    error
  }=
    await sb
    .from("lunch_history")
    .insert({

      shop_id:
        currentShop.id,

      user_id:
        currentUser.id,

      visited_date:
        dateKey(),

      affiliation

    });


  if(
    error?.code==="23505"
  ){

    toast(
      "今日はすでに記録されています。"
    );

    return;

  }


  if(error){

    toast(
      error.message
    );

    return;

  }


  toast(
    `「${currentShop.name}」を記録しました！`
  );


  $("visitedBtn").disabled=true;

  await loadHistory();

  renderShops();

  updateCandidates();

};


/* =========================================================
   COMMENTS
========================================================= */

$("commentBtn").onclick=()=>{

  if(currentShop){

    openComments(
      currentShop.id
    );

  }

};


async function openComments(
  shopId
){

  const shop=
    shops.find(
      x=>x.id===shopId
    );


  if(!shop)return;


  $("commentTitle").textContent=
    `💬 ${shop.name}`;


  $("commentModal")
    .classList
    .add("show");


  $("commentsList").innerHTML=
    `<div class="empty">
      読み込み中...
    </div>`;


  $("commentBody").value="";

  $("sendCommentBtn")
    .dataset
    .shopId=shopId;


  const {
    data,
    error
  }=
    await sb
    .from("comments")
    .select(`
      id,
      body,
      user_id,
      created_at,
      profiles(username),
      comment_likes(user_id)
    `)
    .eq(
      "shop_id",
      shopId
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    $("commentsList").innerHTML=
      `<div class="error">
        ${esc(error.message)}
      </div>`;

    return;

  }


  $("commentsList").innerHTML=
    data?.length
      ?
      data.map(c=>{

        const likes=
          c.comment_likes||[];


        const liked=
          currentUser&&
          likes.some(
            l=>
              l.user_id===
              currentUser.id
          );


        return `

        <div class="comment">

          <div class="comment-head">

            <strong>
              👤 ${
                esc(
                  c.profiles?.username||
                  "ユーザー"
                )
              }
            </strong>

            <span>
              ${
                new Date(
                  c.created_at
                ).toLocaleString(
                  "ja-JP"
                )
              }
            </span>

          </div>


          <div class="comment-body">
            ${esc(c.body)}
          </div>


          <button
            class="like"
            onclick="toggleLike(
              '${c.id}',
              ${liked}
            )">
            ❤️ ${likes.length}
          </button>


          ${
            currentUser&&
            c.user_id===
            currentUser.id
              ?
              `
              <button
                class="like"
                onclick="deleteComment(
                  '${c.id}',
                  '${shopId}'
                )">
                🗑️
              </button>
              `
              :""
          }

        </div>

        `;

      }).join("")
      :
      `<div class="empty">
        まだコメントはありません。
      </div>`;

}


function closeModal(){

  $("commentModal")
    .classList
    .remove("show");

}


async function toggleLike(
  commentId,
  liked
){

  if(
    !currentUser||
    currentProfile?.role==="guest"
  ){

    return;

  }


  if(liked){

    await sb
      .from("comment_likes")
      .delete()
      .eq(
        "comment_id",
        commentId
      )
      .eq(
        "user_id",
        currentUser.id
      );

  }else{

    await sb
      .from("comment_likes")
      .insert({

        comment_id:
          commentId,

        user_id:
          currentUser.id

      });

  }


  await openComments(
    $("sendCommentBtn")
      .dataset
      .shopId
  );

}


async function deleteComment(
  id,
  shopId
){

  if(
    !confirm(
      "コメントを削除しますか？"
    )
  ){

    return;

  }


  const {
    error
  }=
    await sb
    .from("comments")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    toast(
      error.message
    );

  }else{

    await openComments(
      shopId
    );

  }

}


$("sendCommentBtn").onclick=
  async()=>{

    if(
      currentProfile?.role==="guest"
    ){

      toast(
        "コメントするにはログインしてください。"
      );

      return;

    }


    const body=
      $("commentBody")
      .value
      .trim();


    const shopId=
      $("sendCommentBtn")
      .dataset
      .shopId;


    if(!body){

      toast(
        "コメントを入力してください。"
      );

      return;

    }


    const {
      error
    }=
      await sb
      .from("comments")
      .insert({

        shop_id:
          shopId,

        user_id:
          currentUser.id,

        body

      });


    if(error){

      toast(
        error.message
      );

      return;

    }


    $("commentBody").value="";

    await openComments(
      shopId
    );

  };


/* =========================================================
   SHOP EDIT
========================================================= */

function openShopModal(
  s=null
){

  $("shopModal")
    .classList
    .add("show");


  $("shopModalTitle").textContent=
    s
      ?"お店を編集"
      :"お店を追加";


  $("shopId").value=
    s?.id||"";

  $("shopName").value=
    s?.name||"";

  $("shopGenre").value=
    s?.genre||"";

  $("shopRating").value=
    s?.rating??3.50;

  $("shopNote").value=
    s?.note||"";

  $("shopMap").value=
    s?.map_url||"";

}


function closeShopModal(){

  $("shopModal")
    .classList
    .remove("show");

}


$("addShopBtn").onclick=
  ()=>openShopModal();


function editShop(id){

  if(
    currentProfile?.role==="guest"
  ){

    return;

  }


  const s=
    shops.find(
      x=>x.id===id
    );


  if(s){

    openShopModal(s);

  }

}


$("saveShopBtn").onclick=
  async()=>{

    if(
      currentProfile?.role==="guest"
    ){

      return;

    }


    const id=
      $("shopId").value;


    const data={

      name:
        $("shopName")
        .value
        .trim(),

      genre:
        $("shopGenre")
        .value
        .trim(),

      rating:
        Number(
          $("shopRating")
          .value
        ),

      note:
        $("shopNote")
        .value
        .trim(),

      map_url:
        $("shopMap")
        .value
        .trim()

    };


    if(
      !data.name||
      !data.genre
    ){

      toast(
        "店名とジャンルは必須です。"
      );

      return;

    }


    let res;


    if(id){

      /*
        編集履歴はDB側の
        triggerで保存する想定。
      */

      res=
        await sb
        .from("shops")
        .update(data)
        .eq(
          "id",
          id
        );

    }else{

      res=
        await sb
        .from("shops")
        .insert({

          ...data,

          created_by:
            currentUser.id

        });

    }


    if(res.error){

      toast(
        res.error.message
      );

      return;

    }


    closeShopModal();

    toast(
      id
        ?"編集しました。"
        :"お店を追加しました。"
    );


    await loadShops();

  };


async function deleteShop(id){

  if(
    currentProfile?.role==="guest"
  ){

    return;

  }


  if(
    !confirm(
      "この店を削除しますか？"
    )
  ){

    return;

  }


  const {
    error
  }=
    await sb
    .from("shops")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    toast(
      error.message
    );

  }else{

    toast(
      "削除しました。"
    );

    await refreshAll();

  }

}


/* =========================================================
   START
========================================================= */

init();

</script>
